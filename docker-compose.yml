version: '3.8'

services:
  receivables-postgres:
    image: postgres:16-alpine
    container_name: receivables-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: midaz
      POSTGRES_PASSWORD: midaz
      POSTGRES_DB: plugin_receivables
    ports:
      - "5434:5432"
    volumes:
      - receivables_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midaz -d plugin_receivables"]
      interval: 5s
      timeout: 5s
      retries: 5

  receivables-plugin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midaz-plugin-receivables
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - ENV_NAME=development
      - SERVER_ADDRESS=0.0.0.0:8082
      - PLUGIN_HOST=http://localhost:8082
      - CREDENTIALS_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - DB_HOST=receivables-postgres
      - DB_PORT=5432
      - DB_USER=midaz
      - DB_PASSWORD=midaz
      - DB_NAME=plugin_receivables
      - DB_SSLMODE=disable
      - DB_AUTO_MIGRATE=true
      - MIDAZ_ONBOARDING_URL=http://host.docker.internal:3000
      - MIDAZ_TRANSACTION_URL=http://host.docker.internal:3001
      - MIDAZ_ORGANIZATION_ID=01948df2-0000-7000-8000-000000000001
      - MIDAZ_LEDGER_ID=01948df2-0000-7000-8000-000000000002
      - MATCHER_URL=http://host.docker.internal:4018
      - MATCHER_CONTEXT_SLUG=acquirers-settlement
      - MATCHER_WEBHOOK_SECRET=secret_matcher_local_123
      - MATCHER_UPLOAD_WINDOW_DAYS=7
      - SYNC_INTERVAL_MINUTES=60
      - WORKER_BATCH_LIMIT=500
    depends_on:
      receivables-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  receivables_postgres_data:
